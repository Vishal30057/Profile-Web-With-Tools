<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROFILE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 35%, #0c2442 0%, #040914 65%, #010308 100%);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --footer-color: rgba(255, 255, 255, 0.72);
            --card-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.24) 0%, rgba(56, 189, 248, 0.14) 50%, rgba(255, 255, 255, 0.09) 100%);
            --card-border: rgba(125, 211, 252, 0.78);
            --card-border-highlight: #ffffff;
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 32px rgba(0, 240, 255, 0.45), inset 0 0 26px rgba(186, 230, 253, 0.3);
            --backlight-bg: radial-gradient(circle, rgba(0, 240, 255, 0.45) 0%, rgba(59, 130, 246, 0.25) 45%, transparent 70%);
            --title-shadow: 0 0 16px rgba(0, 240, 255, 0.85);
            --avatar-bg: linear-gradient(135deg, #0f172a, #1e293b);
            --avatar-icon: #00ffff;
            --toggle-bg: rgba(255, 255, 255, 0.18);
            --toggle-border: rgba(255, 255, 255, 0.55);
            --toggle-color: #ffffff;
        }

        /* Light Mode Variables */
        body.light-mode {
            --bg-gradient: radial-gradient(circle at 50% 30%, #e0f2fe 0%, #bae6fd 55%, #7dd3fc 100%);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --footer-color: rgba(15, 23, 42, 0.75);
            --card-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.72) 0%, rgba(224, 242, 254, 0.55) 50%, rgba(255, 255, 255, 0.48) 100%);
            --card-border: rgba(2, 132, 199, 0.55);
            --card-border-highlight: #ffffff;
            --card-shadow: 0 20px 50px rgba(2, 132, 199, 0.28), 0 0 30px rgba(56, 189, 248, 0.45), inset 0 0 24px rgba(255, 255, 255, 0.8);
            --backlight-bg: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(56, 189, 248, 0.4) 50%, transparent 72%);
            --title-shadow: 0 2px 12px rgba(2, 132, 199, 0.35);
            --avatar-bg: linear-gradient(135deg, #e0f2fe, #ffffff);
            --avatar-icon: #0284c7;
            --toggle-bg: rgba(255, 255, 255, 0.75);
            --toggle-border: rgba(2, 132, 199, 0.5);
            --toggle-color: #0284c7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Dark / Light Theme Switcher Pill */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--toggle-bg);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1.5px solid var(--toggle-border);
            color: var(--toggle-color);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: transform 0.16s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        .theme-toggle i {
            font-size: 15px;
        }

        /* Background Electro + Water Drops Canvas */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Static Pre-rendered Glow behind the iOS Glass Card */
        .card-backlight {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: var(--backlight-bg);
            z-index: 1;
            pointer-events: none;
            transform: translateZ(0);
            transition: background 0.4s ease;
        }

        /* Wet iOS Glass UI Main Card */
        .profile-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 40px 28px;
            text-align: center;
            border-radius: 34px;
            overflow: hidden;

            background: var(--card-bg);
            backdrop-filter: blur(16px) saturate(165%);
            -webkit-backdrop-filter: blur(16px) saturate(165%);

            border: 2px solid var(--card-border);
            border-top-color: var(--card-border-highlight);
            border-left-color: var(--card-border-highlight);

            box-shadow: var(--card-shadow);
            transform: translateZ(0);
            will-change: transform;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.28) 0%, transparent 45%),
                        radial-gradient(circle at 80% 85%, rgba(56, 189, 248, 0.18) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        #cardWaterCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 4;
        }

        .avatar-wrapper {
            position: relative;
            width: 94px;
            height: 94px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00ffff, #38bdf8, #a855f7, #00ffff);
            animation: spinRing 2.5s linear infinite;
            will-change: transform;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .avatar-placeholder {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--avatar-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: var(--avatar-icon);
            border: 2px solid #ffffff;
            box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.45);
            transition: background 0.4s ease, color 0.4s ease;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 6px;
            color: var(--text-primary);
            text-shadow: var(--title-shadow);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
            transition: color 0.4s ease;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Protected Action Buttons */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 17px 24px;
            border-radius: 18px;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.8px;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), filter 0.16s ease, box-shadow 0.16s ease;
            will-change: transform;
        }

        .btn i, .btn span {
            pointer-events: none;
        }

        .btn i {
            font-size: 21px;
        }

        @media (hover: hover) {
            .btn:hover {
                transform: translateY(-2px) scale(1.02);
                filter: brightness(1.1);
            }
        }

        .btn:active,
        .btn.is-pressed {
            transform: scale(0.93) !important;
            filter: brightness(1.22);
        }

        .touch-ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 70%);
            transform: scale(0);
            animation: rippleWave 0.55s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleWave {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* 3-Finger Gesture Visual Pulse Ring */
        .gesture-ring {
            position: fixed;
            width: 72px;
            height: 72px;
            margin-left: -36px;
            margin-top: -36px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 22px #00f0ff, inset 0 0 12px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 999;
            animation: gestureExpand 0.5s ease-out forwards;
        }

        @keyframes gestureExpand {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #12b854 100%);
            box-shadow: 0 6px 22px rgba(37, 211, 102, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        .btn-email {
            background: linear-gradient(135deg, #ff4b3e 0%, #e02424 100%);
            box-shadow: 0 6px 22px rgba(255, 75, 62, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        .btn-apk {
            background: linear-gradient(135deg, #00e5ff 0%, #0284c7 100%);
            margin-top: 4px;
            box-shadow: 0 6px 26px rgba(2, 132, 199, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        }

        footer {
            margin-top: 28px;
            font-size: 12px;
            font-weight: 500;
            color: var(--footer-color);
            transition: color 0.4s ease;
        }
    </style>
</head>

    <script>
        // 1. Dark & Light Theme Switcher
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        let isLightMode = localStorage.getItem('profileTheme') === 'light';

        function applyTheme() {
            if (isLightMode) {
                document.body.classList.add('light-mode');
                themeIcon.className = 'fas fa-moon';
                themeText.textContent = 'DARK';
            } else {
                document.body.classList.remove('light-mode');
                themeIcon.className = 'fas fa-sun';
                themeText.textContent = 'LIGHT';
            }
        }
        applyTheme();

        themeToggle.addEventListener('click', () => {
            isLightMode = !isLightMode;
            localStorage.setItem('profileTheme', isLightMode ? 'light' : 'dark');
            applyTheme();
        });

        // 2. Anti-Copy & DevTools Protection
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());

        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.ctrlKey && (e.key === 'u' || e.key === 'c' || e.key === 'a' || e.key === 's'))
            ) {
                e.preventDefault();
                return false;
            }
            // Desktop testing shortcut: press '3' to trigger the 3-finger gesture link
            if (e.key === '3') {
                openGestureSecretPage();
            }
        });

        // 3. Secured Links & Three-Finger Touch Gesture
        const secureLinks = {
            whatsapp: 'https://wa.me/94772927241',
            email: 'mailto:varunalu7@gmail.com',
            apk: 'https://www.mediafire.com/file/rz41mpfnrikp5bb/RTC+TOOL+SYSTEM_1.2.apk/file',
            threeFingerGesture: 'https://vishal30057.github.io/My-Love/'
        };

        let gestureCooldown = false;
        function openGestureSecretPage(touches = []) {
            if (gestureCooldown) return;
            gestureCooldown = true;

            // Show glowing pulse rings under the 3 fingertips
            for (let i = 0; i < touches.length; i++) {

                ring.className = 'gesture-ring';
                ring.style.left = `${touches[i].clientX}px`;

            setTimeout(() => {
                window.open(secureLinks.threeFingerGesture, '_blank', 'noopener,noreferrer');
            }, 180);

            setTimeout(() => {
                gestureCooldown = false;
            }, 1200);
        }

        // Detect 3-finger touch anywhere on the page
        document.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length === 3) {
                openGestureSecretPage(e.touches);
            }
        }, { passive: true });

        // Button Touch Ripples & Secured Open
        document.querySelectorAll('.touch-btn').forEach(btn => {
            const triggerAction = (e) => {
                if (e.touches && e.touches.length >= 3) return; // Don't trigger button if 3-finger gesture is used

                btn.classList.add('is-pressed');
                setTimeout(() => btn.classList.remove('is-pressed'), 180);

                const rect = btn.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const size = Math.max(rect.width, rect.height);

                const ripple = document.createElement('span');
                ripple.className = 'touch-ripple';
                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${clientX - rect.left - size / 2}px`;
                ripple.style.top = `${clientY - rect.top - size / 2}px`;

                btn.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());

                const actionKey = btn.getAttribute('data-action');
                if (secureLinks[actionKey]) {
                    setTimeout(() => {
                        window.open(secureLinks[actionKey], '_blank', 'noopener,noreferrer');
                    }, 120);
                }
            };

            btn.addEventListener('pointerdown', triggerAction, { passive: true });
        });

        // 4. Realistic 3D Water Droplet Renderer (Adapts to Dark & Light Mode)
        function drawRealisticWaterDrop(ctx, x, y, r, stretchY = 1, alpha = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(1, stretchY);
            ctx.globalAlpha = alpha;

            ctx.beginPath();
            ctx.arc(0, r * 0.18, r * 1.02, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.fillStyle = isLightMode ? 'rgba(2, 132, 199, 0.25)' : 'rgba(0, 8, 20, 0.48)';
            ctx.fill();

            const bodyGrad = ctx.createRadialGradient(
                -r * 0.25, -r * 0.25, r * 0.05,
                0, 0, r
            );
            if (isLightMode) {
                bodyGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
                bodyGrad.addColorStop(0.55, 'rgba(224, 242, 254, 0.22)');
                bodyGrad.addColorStop(0.88, 'rgba(2, 132, 199, 0.28)');
                bodyGrad.addColorStop(1, 'rgba(255, 255, 255, 0.85)');
            } else {
                bodyGrad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
                bodyGrad.addColorStop(0.55, 'rgba(186, 230, 253, 0.10)');
                bodyGrad.addColorStop(0.88, 'rgba(56, 189, 248, 0.28)');
                bodyGrad.addColorStop(1, 'rgba(255, 255, 255, 0.55)');
            }

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = bodyGrad;
            ctx.fill();

            ctx.lineWidth = Math.max(0.7, r * 0.08);
            ctx.strokeStyle = isLightMode ? 'rgba(2, 132, 199, 0.45)' : 'rgba(224, 242, 254, 0.52)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, r * 0.42, r * 0.52, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.strokeStyle = isLightMode ? 'rgba(255, 255, 255, 0.92)' : 'rgba(125, 249, 255, 0.78)';
            ctx.lineWidth = Math.max(0.8, r * 0.14);
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(-r * 0.34, -r * 0.34, r * 0.24, r * 0.14, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fill();

            if (r > 3.5) {
                ctx.beginPath();
                ctx.arc(-r * 0.14, -r * 0.52, r * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.fill();
            }

            ctx.restore();
        }

        const cardEl = document.getElementById('profileCard');
        const cardCanvas = document.getElementById('cardWaterCanvas');
        const cardCtx = cardCanvas.getContext('2d');

        let cardW = 0, cardH = 0;
        let staticCardDrops = [];
        let slidingCardDrops = [];

        function initCardWater() {
            const rect = cardEl.getBoundingClientRect();
            cardW = cardCanvas.width = rect.width;
            cardH = cardCanvas.height = rect.height;

            staticCardDrops = [];
            for (let i = 0; i < 58; i++) {
                let x = Math.random() * cardW;
                let y = Math.random() * cardH;
                const normX = (x / cardW) - 0.5;
                const normY = (y / cardH) - 0.5;
                const distFromCenter = Math.hypot(normX, normY);
                const r = distFromCenter > 0.28 ? (1.8 + Math.random() * 4.2) : (1.0 + Math.random() * 2.0);
                staticCardDrops.push({ x, y, r, stretch: 1 + Math.random() * 0.18 });
            }

            slidingCardDrops = Array.from({ length: 5 }, () => ({
                x: 20 + Math.random() * (cardW - 40),
                y: Math.random() * cardH,
                r: 3.8 + Math.random() * 3.2,
                vy: 0.18 + Math.random() * 0.35,
                wobble: Math.random() * Math.PI * 2,
                trail: []
            }));
        }

        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width = 0, height = 0;
        let bgDrops = [];

        function initBg() {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
            const dropCount = Math.min(48, Math.floor((width * height) / 24000));
            bgDrops = Array.from({ length: dropCount }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: 3 + Math.random() * 8.5,
                vy: 0.15 + Math.random() * 0.45,
                drift: (Math.random() - 0.5) * 0.12,
                stretch: 1.05 + Math.random() * 0.22
            }));
        }

        function resizeAll() {
            initBg();
            initCardWater();
        }
        window.addEventListener('resize', resizeAll, { passive: true });
        resizeAll();

        class LightningBolt {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.angle = Math.random() * Math.PI * 2;
                this.length = 90 + Math.random() * 150;
                this.life = 0;
                this.maxLife = 10 + Math.random() * 10;
                this.points = new Float32Array(18);
                this.buildPath();
            }
            buildPath() {
                let cx = this.x, cy = this.y;
                const stepLen = this.length / 8;
                const cosA = Math.cos(this.angle);
                const sinA = Math.sin(this.angle);
                this.points[0] = cx;
                this.points[1] = cy;
                for (let i = 1; i <= 8; i++) {
                    const jitter = (Math.random() - 0.5) * 32;
                    cx += cosA * stepLen - sinA * jitter;
                    cy += sinA * stepLen + cosA * jitter;
                    this.points[i * 2] = cx;
                    this.points[i * 2 + 1] = cy;
                }
            }
            update() {
                this.life++;
                if (this.life % 3 === 0) this.buildPath();
            }
            draw(ctx) {
                const alpha = 1 - this.life / this.maxLife;
                ctx.beginPath();
                ctx.moveTo(this.points[0], this.points[1]);
                for (let i = 2; i < this.points.length; i += 2) {
                    ctx.lineTo(this.points[i], this.points[i + 1]);
                }
                ctx.strokeStyle = isLightMode
                    ? `rgba(2, 132, 199, ${alpha * 0.35})`
                    : `rgba(0, 229, 255, ${alpha * 0.32})`;
                ctx.lineWidth = 5.5;
                ctx.stroke();

                ctx.strokeStyle = isLightMode
                    ? `rgba(255, 255, 255, ${alpha * 0.95})`
                    : `rgba(224, 247, 255, ${alpha * 0.92})`;
                ctx.lineWidth = 1.4;
                ctx.stroke();
            }
        }

        const sparks = Array.from({ length: 24 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 1.0,
            vy: (Math.random() - 0.5) * 1.0,
            r: Math.random() * 1.8 + 0.8
        }));

        const bolts = [];

        function animate() {
            bgCtx.clearRect(0, 0, width, height);

            bgCtx.fillStyle = isLightMode ? 'rgba(2, 132, 199, 0.55)' : 'rgba(125, 249, 255, 0.75)';
            bgCtx.beginPath();
            for (let i = 0; i < sparks.length; i++) {
                const s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                if (s.x < 0) s.x = width;
                else if (s.x > width) s.x = 0;
                if (s.y < 0) s.y = height;
                else if (s.y > height) s.y = 0;
                bgCtx.moveTo(s.x + s.r, s.y);
                bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            }
            bgCtx.fill();

            if (Math.random() < 0.065 && bolts.length < 4) {
                bolts.push(new LightningBolt());
            }
            for (let i = bolts.length - 1; i >= 0; i--) {
                bolts[i].update();
                bolts[i].draw(bgCtx);
                if (bolts[i].life >= bolts[i].maxLife) bolts.splice(i, 1);
            }

            for (let i = 0; i < bgDrops.length; i++) {
                const d = bgDrops[i];
                d.y += d.vy;
                d.x += d.drift;
                if (d.y - d.r > height) {
                    d.y = -d.r * 2;
                    d.x = Math.random() * width;
                }
                drawRealisticWaterDrop(bgCtx, d.x, d.y, d.r, d.stretch, 0.88);
            }

            cardCtx.clearRect(0, 0, cardW, cardH);

            for (let i = 0; i < staticCardDrops.length; i++) {
                const sd = staticCardDrops[i];
                drawRealisticWaterDrop(cardCtx, sd.x, sd.y, sd.r, sd.stretch, 0.85);
            }

            for (let i = 0; i < slidingCardDrops.length; i++) {
                const md = slidingCardDrops[i];
                md.wobble += 0.04;
                md.y += md.vy;
                md.x += Math.sin(md.wobble) * 0.15;

                if (Math.random() < 0.35) {
                    md.trail.push({ x: md.x, y: md.y - md.r * 0.8, r: md.r * 0.28, alpha: 0.65 });
                    if (md.trail.length > 14) md.trail.shift();
                }

                for (let t = 0; t < md.trail.length; t++) {
                    const tr = md.trail[t];
                    tr.alpha *= 0.985;
                    drawRealisticWaterDrop(cardCtx, tr.x, tr.y, tr.r, 1.1, tr.alpha);
                }

                if (md.y - md.r > cardH) {
                    md.y = -md.r * 2;
                    md.x = 20 + Math.random() * (cardW - 40);
                    md.trail = [];
                }

                drawRealisticWaterDrop(cardCtx, md.x, md.y, md.r, 1.24, 0.95);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
